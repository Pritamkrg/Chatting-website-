<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatWave - Chat App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-app {
      width: 95%;
      max-width: 1100px;
      height: 90vh;
      background: white;
      display: flex;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    /* Sidebar */
    .sidebar {
      width: 32%;
      background: #ffffff;
      border-right: 1px solid #ddd;
    }

    .profile {
      padding: 20px;
      background: #6c5ce7;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      background: #fff;
      color: #6c5ce7;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
    }

    .search {
      padding: 15px;
    }

    .search input {
      width: 100%;
      padding: 12px;
      border: none;
      background: #f1f1f1;
      border-radius: 20px;
      outline: none;
    }

    .contact {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
    }

    .contact:hover {
      background: #f5f3ff;
    }

    .contact-avatar {
      width: 45px;
      height: 45px;
      background: #ddd;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .contact-info h4 {
      margin-bottom: 4px;
    }

    .contact-info p {
      color: #777;
      font-size: 13px;
    }

    /* Chat area */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 75px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #ddd;
    }

    .status {
      color: #22a06b;
      font-size: 12px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f7f7fb;
    }

    .message {
      max-width: 65%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .received {
      background: white;
      border-top-left-radius: 3px;
    }

    .sent {
      background: #6c5ce7;
      color: white;
      margin-left: auto;
      border-top-right-radius: 3px;
    }

    .time {
      display: block;
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.7;
    }

    .message-box {
      padding: 15px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .message-box input {
      flex: 1;
      padding: 13px 18px;
      border: none;
      background: #f1f1f1;
      border-radius: 25px;
      outline: none;
    }

    .send-btn {
      width: 50px;
      border: none;
      border-radius: 50%;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .send-btn:hover {
      background: #5848d6;
    }

    @media (max-width: 700px) {
      .chat-app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      .sidebar {
        width: 35%;
      }

      .message {
        max-width: 80%;
      }

      .contact-info {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="chat-app">

    <!-- Sidebar -->
    <div class="sidebar">

      <div class="profile">
        <div class="avatar">P</div>
        <div>
          <h3>ChatWave</h3>
          <small>Online</small>
        </div>
      </div>

      <div class="search">
        <input type="text" placeholder="Search chats...">
      </div>

      <div class="contact" onclick="openChat('Alex')">
        <div class="contact-avatar">A</div>
        <div class="contact-info">
          <h4>Alex</h4>
          <p>Hey! How are you?</p>
        </div>
      </div>

      <div class="contact" onclick="openChat('Rahul')">
        <div class="contact-avatar">R</div>
        <div class="contact-info">
          <h4>Rahul</h4>
          <p>See you tomorrow!</p>
        </div>
      </div>

      <div class="contact" onclick="openChat('Sarah')">
        <div class="contact-avatar">S</div>
        <div class="contact-info">
          <h4>Sarah</h4>
          <p>Nice project 👍</p>
        </div>
      </div>

    </div>

    <!-- Chat -->
    <div class="chat">

      <div class="chat-header">
        <div class="contact-avatar">A</div>
        <div>
          <h3 id="chatName">Alex</h3>
          <span class="status">● Online</span>
        </div>
      </div>

      <div class="messages" id="messages">

        <div class="message received">
          Hey! How are you?
          <span class="time">10:30 AM</span>
        </div>

        <div class="message sent">
          I'm good! What about you?
          <span class="time">10:31 AM</span>
        </div>

        <div class="message received">
          I'm doing great! 😊
          <span class="time">10:32 AM</span>
        </div>

      </div>

      <div class="message-box">
        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          onkeydown="handleEnter(event)"
        >

        <button class="send-btn" onclick="sendMessage()">
          ➤
        </button>
      </div>

    </div>

  </div>

  <script>

    function sendMessage() {

      const input = document.getElementById("messageInput");
      const message = input.value.trim();

      if (message === "") return;

      const messages = document.getElementById("messages");

      const newMessage = document.createElement("div");
      newMessage.className = "message sent";

      const time = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

      newMessage.innerHTML = `
        ${escapeHTML(message)}
        <span class="time">${time}</span>
      `;

      messages.appendChild(newMessage);

      input.value = "";

      messages.scrollTop = messages.scrollHeight;

      // Demo auto reply
      setTimeout(() => {

        const reply = document.createElement("div");
        reply.className = "message received";

        reply.innerHTML = `
          Thanks for your message! 😊
          <span class="time">${new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          })}</span>
        `;

        messages.appendChild(reply);
        messages.scrollTop = messages.scrollHeight;

      }, 800);
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function openChat(name) {
      document.getElementById("chatName").textContent = name;
      document.getElementById("messages").innerHTML = `
        <div class="message received">
          Hi! You are now chatting with ${escapeHTML(name)}.
          <span class="time">Now</span>
        </div>
      `;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

  </script>

</body>
</html>
